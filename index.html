<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Sem nome por enquanto: este título só aparece na aba do navegador. Troque quando tiver um. -->
  <title>Biblioteca</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <!-- o ?v=6 força o navegador a baixar o CSS de novo; some 1 a cada atualização -->
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>

  <header class="topo">
    <img class="marca" src="logo.png" alt="">
    <nav class="abas" aria-label="Seções">
      <button class="aba on" type="button" data-aba="curso">Curso</button>
      <button class="aba" type="button" data-aba="biblioteca">Biblioteca</button>
    </nav>
  </header>

  <main>
    <!-- ===== CURSO ===== -->
    <section id="view-curso" class="view">
      <div class="curso">
        <aside class="trilha" aria-label="Módulos e aulas">
          <div id="trilha"></div>
          <p id="curso-erro" class="aviso" hidden>Não foi possível carregar curso.json.</p>
        </aside>

        <article id="aula" class="aula" aria-live="polite"></article>
      </div>
    </section>

    <!-- ===== BIBLIOTECA ===== -->
    <section id="view-biblioteca" class="view" hidden>
      <div class="cabeca-bib">
        <input id="busca" type="search" placeholder="buscar título, autor ou assunto" autocomplete="off">
        <label class="ordem">
          <select id="ordem" aria-label="Ordenar">
            <option value="titulo">título A–Z</option>
            <option value="autor">autor A–Z</option>
            <option value="ano">mais antigas</option>
            <option value="ano-desc">mais recentes</option>
          </select>
        </label>
      </div>

      <details class="painel-filtros">
  <summary>filtros <span id="ativos-filtros"></span></summary>
  <div class="filtros-bib" id="filtros"></div>
</details>

      <p id="contagem" class="contagem"></p>
      <ul id="grade" class="grade"></ul>
      <p id="vazio" class="aviso" hidden>Nenhuma obra encontrada com esses filtros.</p>

      <nav class="paginacao" id="paginacao" aria-label="Páginas"></nav>
    </section>
  </main>

  <dialog id="detalhe" class="detalhe">
    <button class="fechar" type="button" aria-label="Fechar" id="fechar">×</button>
    <div id="detalhe-corpo"></div>
  </dialog>

  <script src="app.js?v=8"></script>
</body>
</html>
